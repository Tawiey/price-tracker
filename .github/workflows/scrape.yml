name: Monthly Price Scrape

on:
  schedule:
    - cron: '0 8 1 * *'  # 1st of every month at 10:00 SAST
  workflow_dispatch:
  # Any change to the scraper is validated by a real run, so a broken parser
  # is caught immediately rather than a month later.
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/scrape.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test accessory filters
        run: python scripts/test_filters.py

      # Exits non-zero if nothing was collected from either store, so a broken
      # scraper fails the run instead of committing a bare date bump.
      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit updated prices
        run: |
          git config user.name  "Price Tracker Bot"
          git config user.email "action@github.com"
          git add data/prices.json
          if git diff --staged --quiet; then
            echo "No new data."
          else
            git commit -m "chore: price update $(date +'%Y-%m-%d')"
            git push
          fi
