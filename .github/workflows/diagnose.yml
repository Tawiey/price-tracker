name: Scraper Diagnostic

# Temporary. Manually dispatched to inspect what Takealot / Amazon SA actually
# return, so the scraper parsers can be fixed. Remove once scraping works.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Probe retailers
        run: python scripts/diagnose.py
